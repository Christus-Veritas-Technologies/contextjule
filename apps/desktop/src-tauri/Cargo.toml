[package]
name = "contextjule"
version = "0.1.0"
description = "A desktop pet that reads your AI context window."
authors = ["Christus Veritas Technologies"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which would
# otherwise collide on Windows. See rust-lang/cargo#8519.
name = "contextjule_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Start with the machine — a desktop pet that has to be launched by hand
# is one people stop launching.
tauri-plugin-autostart = "2"
# Only ever used to hand the user a `/clear` they asked for.
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SQLite compiled into the binary. `bundled` is the whole point: the installer
# must not depend on a system SQLite being present, or on anything else outside
# the executable.
rusqlite = { version = "0.32", features = ["bundled"] }

# Only ever used to reach our own API and Dodo's public license endpoints.
# rustls rather than native-tls so there is no OpenSSL to ship or find.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }

[features]
# Enabled by tauri-cli for the updater.
default = []
