name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Prisma client is generated code, not committed, so every job that
      # typechecks has to produce it first.
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/contextjule

      - run: pnpm lint

      - run: pnpm check-types
        env:
          SKIP_ENV_VALIDATION: "true"

      - run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "true"
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
